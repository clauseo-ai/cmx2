name: ci
on:
  push:
    branches: [main, "win/**"]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: what the tests need on the machine (ripgrep, imagemagick, a git identity)
        run: |
          sudo apt-get install -y ripgrep imagemagick
          git config --global user.name ci
          git config --global user.email ci@example.invalid
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit -p .
      - run: bun test packages
      - name: the generated client matches the contract
        run: bun packages/contract/src/generate.ts --check
      - name: no strings from the maintainer's pattern list
        run: scripts/check-public.sh
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        id: setup-bun
        continue-on-error: true
        with:
          bun-version: 1.4.3
      - name: bun from npm when the github release download fails (it has answered 504 on windows runners)
        if: steps.setup-bun.outcome == 'failure'
        run: npm install -g bun@1.4.3
      - name: what the tests need on the machine (ripgrep, a git identity)
        run: |
          choco install ripgrep -y --no-progress
          git config --global user.name ci
          git config --global user.email ci@example.invalid
      - run: bun install --frozen-lockfile
      # bun run, not bunx: the bunx an npm-installed bun leaves on windows does not start
      - run: bun run typecheck
      # one step per package, each run even when an earlier one failed, so a failure names its area
      - { name: "test platform", if: "!cancelled()", run: bun test packages/platform }
      - { name: "test tools", if: "!cancelled()", run: bun test packages/tools }
      - { name: "test procs", if: "!cancelled()", run: bun test packages/procs }
      - { name: "test worktrees", if: "!cancelled()", run: bun test packages/worktrees }
      - { name: "test store", if: "!cancelled()", run: bun test packages/store }
      - { name: "test engine", if: "!cancelled()", run: bun test packages/engine }
      - { name: "test actors", if: "!cancelled()", run: bun test packages/actors }
      - { name: "test routing, prompts, contract, client", if: "!cancelled()", run: bun test packages/routing packages/prompts packages/contract packages/client }
      - { name: "test cli", if: "!cancelled()", run: bun test packages/cli }
      - { name: "test server", if: "!cancelled()", run: bun test packages/server }
      - { name: "test tui", if: "!cancelled()", run: bun test packages/tui }
  # the windows binary end to end on a throwaway runner: build, install the logon task, upgrade over the running
  # exe, restart, uninstall. ports 4831 and up, never the default 4097
  windows-binary:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    env:
      PORT: "4831"
      LABEL: dev.cmx2.serve
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        id: setup-bun
        continue-on-error: true
        with:
          bun-version: 1.4.3
      - name: bun from npm when the github release download fails
        if: steps.setup-bun.outcome == 'failure'
        run: npm install -g bun@1.4.3
      - name: what the binary needs on the machine (ripgrep, a git identity)
        run: |
          choco install ripgrep -y --no-progress
          git config --global user.name ci
          git config --global user.email ci@example.invalid
      - name: a data and config dir with a space in the path, so the task's quoting is tested
        run: |
          "CMX2_DATA_DIR=$env:RUNNER_TEMP\cmx2 data" >> $env:GITHUB_ENV
          "CMX2_CONFIG_DIR=$env:RUNNER_TEMP\cmx2 config" >> $env:GITHUB_ENV
      - run: bun install --frozen-lockfile
      - name: what a compiled module sees of itself on windows (import.meta.url, Bun.main, argv)
        run: |
          'console.log(JSON.stringify({ url: import.meta.url, path: import.meta.path, main: Bun.main, argv: process.argv, exec: process.execPath }))' > "$env:RUNNER_TEMP\probe.ts"
          bun build --compile "$env:RUNNER_TEMP\probe.ts" --outfile "$env:RUNNER_TEMP\probe.exe"
          & "$env:RUNNER_TEMP\probe.exe"
      - name: build the binary natively
        run: |
          bun scripts/build.ts --out dist
          if ($LASTEXITCODE) { exit 1 }
          Get-Item dist\cmx2.exe
      - name: --version, --help and doctor
        run: |
          $v = dist\cmx2.exe --version
          "version: $v"
          if ($LASTEXITCODE -or $v -notmatch '^\d+\.\d+\.\d+') { exit 1 }
          dist\cmx2.exe --help
          if ($LASTEXITCODE) { exit 1 }
          # no provider key here, so doctor exits 1; it has to run and print the windows checks
          $out = dist\cmx2.exe doctor --offline --port $env:PORT | Out-String
          $out
          if ($LASTEXITCODE -gt 1) { exit 1 }
          foreach ($w in 'git bash', 'ripgrep', 'long paths', 'service') { if ($out -notmatch $w) { "doctor did not report $w"; exit 1 } }
          exit 0
      - name: serve --install, then the task, the process tree and serve --status
        run: |
          dist\cmx2.exe serve --install --port $env:PORT
          $code = $LASTEXITCODE
          schtasks /Query /TN $env:LABEL /V /FO LIST
          Get-CimInstance Win32_Process | Where-Object { $_.Name -in 'cmx2.exe', 'conhost.exe' } | Select-Object ProcessId, ParentProcessId, Name, CommandLine | Format-List
          if ($code) { "install exited $code"; exit 1 }
          Invoke-RestMethod "http://127.0.0.1:$env:PORT/global/health" | Format-List
          & "$env:CMX2_DATA_DIR\bin\cmx2.exe" serve --status
          if ($LASTEXITCODE) { exit 1 }
          schtasks /Query /TN $env:LABEL /XML
          dist\cmx2.exe doctor --offline --port $env:PORT
          exit 0
      - name: the supervisor starts the daemon again when it is killed
        run: |
          function Wait-Health([int]$not = 0, [int]$secs = 60) { $until = (Get-Date).AddSeconds($secs); while ((Get-Date) -lt $until) { try { $h = Invoke-RestMethod "http://127.0.0.1:$env:PORT/global/health" -TimeoutSec 2; if ($h.pid -and $h.pid -ne $not) { return $h } } catch {}; Start-Sleep -Milliseconds 500 }; throw "no daemon other than $not answered on $env:PORT" }
          $before = Wait-Health
          Stop-Process -Id $before.pid -Force
          $after = Wait-Health -not $before.pid
          "killed $($before.pid), the supervisor started $($after.pid)"
      - name: what schtasks /End stops (it decides how restart and uninstall clean up)
        run: |
          function Wait-Health([int]$not = 0, [int]$secs = 60) { $until = (Get-Date).AddSeconds($secs); while ((Get-Date) -lt $until) { try { $h = Invoke-RestMethod "http://127.0.0.1:$env:PORT/global/health" -TimeoutSec 2; if ($h.pid -and $h.pid -ne $not) { return $h } } catch {}; Start-Sleep -Milliseconds 500 }; throw "no daemon other than $not answered on $env:PORT" }
          $h = Wait-Health
          schtasks /End /TN $env:LABEL
          Start-Sleep 3
          $left = Get-CimInstance Win32_Process | Where-Object { $_.Name -in 'cmx2.exe', 'conhost.exe' } | Select-Object ProcessId, ParentProcessId, Name, CommandLine
          $left | Format-List
          $still = try { Invoke-RestMethod "http://127.0.0.1:$env:PORT/global/health" -TimeoutSec 2 } catch { $null }
          "after schtasks /End: daemon $($h.pid) answers: $([bool]$still); cmx2 processes left: $(@($left | Where-Object Name -eq 'cmx2.exe').Count)"
          # back to a running service the way a person would: install again, which stops what is left first
          dist\cmx2.exe serve --install --port $env:PORT
          if ($LASTEXITCODE) { exit 1 }
      - name: cmx2 upgrade --from a dir made by build.ts --all swaps the running exe and restarts
        run: |
          bun scripts/build.ts --all --version 99.0.0 --out dist2
          if ($LASTEXITCODE) { exit 1 }
          Get-Content dist2\SHA256SUMS
          dist\cmx2.exe upgrade --from "$PWD\dist2"
          if ($LASTEXITCODE) { exit 1 }
          $h = Invoke-RestMethod "http://127.0.0.1:$env:PORT/global/health"
          $h | Format-List
          if ($h.version -ne '99.0.0') { "health says $($h.version), not 99.0.0"; exit 1 }
          Get-ChildItem "$env:CMX2_DATA_DIR\bin" | Format-Table Name, Length
          if (-not (Get-ChildItem "$env:CMX2_DATA_DIR\bin\cmx2.exe.old-*")) { "the old exe was not renamed aside"; exit 1 }
          $v = & "$env:CMX2_DATA_DIR\bin\cmx2.exe" --version
          if ($v -ne '99.0.0') { "the installed exe says $v"; exit 1 }
      - name: serve --uninstall removes the task and stops every process
        run: |
          dist\cmx2.exe serve --uninstall
          if ($LASTEXITCODE) { exit 1 }
          Start-Sleep 2
          schtasks /Query /TN $env:LABEL 2>$null
          if (-not $LASTEXITCODE) { "the task is still there"; exit 1 }
          $left = Get-CimInstance Win32_Process | Where-Object { $_.Name -eq 'cmx2.exe' -or ($_.Name -eq 'conhost.exe' -and $_.CommandLine -match 'cmx2') }
          $left | Select-Object ProcessId, Name, CommandLine | Format-List
          if ($left) { "processes are left"; exit 1 }
          $still = try { Invoke-RestMethod "http://127.0.0.1:$env:PORT/global/health" -TimeoutSec 2 } catch { $null }
          if ($still) { "something still answers on $env:PORT"; exit 1 }
          dist\cmx2.exe serve --status
          "status exit: $LASTEXITCODE (1 is not installed)"
          exit 0
      - name: serve.log
        if: always()
        run: |
          Get-Content "$env:CMX2_DATA_DIR\log\serve.log" -ErrorAction SilentlyContinue | Select-Object -Last 200
          Get-ChildItem "$env:CMX2_DATA_DIR" -ErrorAction SilentlyContinue
