name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit -p .
      - run: bun test packages
      - name: the generated client matches the contract
        run: bun packages/contract/src/generate.ts --check
      - name: no strings from the maintainer's pattern list
        run: scripts/check-public.sh
